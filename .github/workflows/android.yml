name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          unzip -q SimCityPlatModMenu-GitHub.zip -d source

      - name: Compilar APK
        working-directory: source/SimCityPlatModMenu-GitHub/SimCityPlatModMenu
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: SimCityPlatModMenu-APK
          path: source/SimCityPlatModMenu-GitHub/SimCityPlatModMenu/app/build/outputs/apk/debug/app-debug.apk
