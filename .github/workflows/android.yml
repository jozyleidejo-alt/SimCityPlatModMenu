
name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extrair projeto
        run: |
          mkdir -p source
          unzip -q SimCityPlatModMenu-GitHub.zip -d source

      - name: Localizar projeto Android
        run: |
          PROJECT_DIR=$(find source -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projeto localizado em: $PROJECT_DIR"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          printf '\n\ntasks.withType<JavaCompile>().configureEach { sourceCompatibility = "17"; targetCompatibility = "17" }\n' >> "$PROJECT_DIR/app/build.gradle.kts"

          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: SimCityPlatModMenu-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
